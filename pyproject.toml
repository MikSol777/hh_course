[tool.poetry]
name = "hh-course"
version = "0.1.0"
description = ""
authors = ["Mikhail Sol <solomennikov_m@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
isort = "^6.0.1"
mypy = "^1.15.0"
black = "^25.1.0"
flake8 = "^7.1.2"
pytest = "^8.3.5"
pytest-cov = "^6.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''
